services:
  rental_db:
    image: postgres:17
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password
    ports:
      - "5433:5432"
    volumes:
      - rental_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_user -d rental_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking_db:
    image: postgres:17
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
    ports:
      - "5435:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment_db:
    image: postgres:17
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5434:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry_db:
    image: postgres:17
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    ports:
      - "5436:5432"
    volumes:
      - telemetry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    hostname: carsharing-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: carsharing
      RABBITMQ_DEFAULT_PASS: carsharing_password
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  rental_service:
    build: ./rental_service
    ports:
      - "8001:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://rental_user:rental_password@rental_db:5432/rental_db
      AMQP_URL: amqp://carsharing:carsharing_password@rabbitmq:5672/
    depends_on:
      rental_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment_service:
    build: ./payment_service
    ports:
      - "8003:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://payment_user:payment_password@payment_db:5432/payment_db
      AMQP_URL: amqp://carsharing:carsharing_password@rabbitmq:5672/
    depends_on:
      payment_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  telemetry_service:
    build: ./telemetry_service
    ports:
      - "8004:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://telemetry_user:telemetry_password@telemetry_db:5432/telemetry_db
    depends_on:
      telemetry_db:
        condition: service_healthy

  booking_service:
    build: ./booking_service
    ports:
      - "8002:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://booking_user:booking_password@booking_db:5432/booking_db
      TELEMETRY_SERVICE_URL: http://telemetry_service:8000
    depends_on:
      booking_db:
        condition: service_healthy
      telemetry_service:
        condition: service_started

  auth_db:
    image: postgres:17
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth_service:
    build: ./auth_service
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://auth_user:auth_password@auth_db:5432/auth_db
      LICENSE_SERVICE_URL: ${LICENSE_SERVICE_URL:-http://license_service:8000}
      LICENSE_STATUS_KEY: ${LICENSE_STATUS_KEY:-carsharing-local-license-key}
    depends_on:
      auth_db:
        condition: service_healthy

  license_db:
    image: postgres:17
    environment:
      POSTGRES_DB: license_db
      POSTGRES_USER: license_user
      POSTGRES_PASSWORD: license_password
    volumes:
      - license_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license_user -d license_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  license_service:
    build: ./license_service
    ports:
      - "127.0.0.1:8006:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://license_user:license_password@license_db:5432/license_db
      AUTH_SERVICE_URL: http://auth_service:8000
      LICENSE_STATUS_KEY: ${LICENSE_STATUS_KEY:-carsharing-local-license-key}
    depends_on:
      license_db:
        condition: service_healthy
      auth_service:
        condition: service_started

  condition_db:
    image: postgres:17
    environment:
      POSTGRES_DB: condition_db
      POSTGRES_USER: condition_user
      POSTGRES_PASSWORD: condition_password
    volumes:
      - condition_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condition_user -d condition_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  condition_storage:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${CONDITION_S3_USER:-carsharing-local}
      MINIO_ROOT_PASSWORD: ${CONDITION_S3_PASSWORD:-condition-local-password}
    volumes:
      - condition_photos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  vehicle_condition_service:
    build: ./vehicle_condition_service
    ports:
      - "127.0.0.1:8007:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://condition_user:condition_password@condition_db:5432/condition_db
      S3_ENDPOINT_URL: http://condition_storage:9000
      S3_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: ${CONDITION_S3_USER:-carsharing-local}
      AWS_SECRET_ACCESS_KEY: ${CONDITION_S3_PASSWORD:-condition-local-password}
    depends_on:
      condition_db:
        condition: service_healthy
      condition_storage:
        condition: service_healthy
      auth_service:
        condition: service_started
      booking_service:
        condition: service_started
      rental_service:
        condition: service_started

  support_db:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: support_user
      MONGO_INITDB_ROOT_PASSWORD: support_local_password
    volumes:
      - support_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "support_db", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  support_service:
    build: ./support_service
    ports:
      - "127.0.0.1:8008:8000"
    environment:
      MONGO_URL: mongodb://support_user:support_local_password@support_db:27017/?authSource=admin
      MONGO_DATABASE: support
    depends_on:
      support_db:
        condition: service_healthy
      auth_service:
        condition: service_started
      rental_service:
        condition: service_started

volumes:
  rental_data:
  booking_data:
  payment_data:
  telemetry_data:
  rabbitmq_data:
  auth_data:
  license_data:
  condition_data:
  condition_photos:
  support_data:
