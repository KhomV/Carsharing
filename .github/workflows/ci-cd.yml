name: Carsharing CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carsharing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated test images
        run: docker compose -f compose.tests.yaml build
      - name: Unit tests rental without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps rental_tests python -m pytest tests/unit -v
      - name: Unit tests booking without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps booking_tests python -m pytest tests/unit -v
      - name: Unit tests payment without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps payment_tests python -m pytest tests/unit -v
      - name: Unit tests telemetry without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps telemetry_tests python -m pytest tests/unit -v
      - name: Unit tests authentication without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps auth_tests python -m pytest tests/unit -v
      - name: Unit tests driver license verification without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps license_tests python -m pytest tests/unit -v
      - name: Unit tests vehicle condition reporting without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps condition_tests python -m pytest tests/unit -v
      - name: Unit tests support without database
        run: docker compose -f compose.tests.yaml run --rm --no-deps support_tests python -m pytest tests/unit -v
      - name: Start isolated databases
        run: docker compose -f compose.tests.yaml up -d --wait rental_test_db booking_test_db payment_test_db telemetry_test_db auth_test_db license_test_db condition_test_db support_test_db
      - name: Integration tests rental PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps rental_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests booking PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps booking_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests payment PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps payment_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests telemetry PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps telemetry_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests authentication PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps auth_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests driver license verification PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps license_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests vehicle condition reporting PostgreSQL
        run: docker compose -f compose.tests.yaml run --rm --no-deps condition_tests sh -c 'python -m alembic upgrade head && python -m pytest tests/integration -v'
      - name: Integration tests support MongoDB
        run: docker compose -f compose.tests.yaml run --rm --no-deps support_tests python -m pytest tests/integration -v
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start the complete system
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Test rental and payment integration
        run: python3 deploy/smoke_test.py
      - name: Test authentication and driver license integration
        run: python3 deploy/smoke_license.py
      - name: Test vehicle condition reporting and photo storage
        run: python3 deploy/smoke_condition.py
      - name: Test support ticket flow
        run: python3 deploy/smoke_support.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Clean up test containers and data
        if: always()
        run: |
          docker compose down -v
          docker compose -f compose.tests.yaml down -v

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: khommv
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: |
          docker build -t "$DOCKERHUB_USERNAME/carsharing-rental:$GITHUB_SHA" rental_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-booking:$GITHUB_SHA" booking_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-payment:$GITHUB_SHA" payment_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-telemetry:$GITHUB_SHA" telemetry_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-auth:$GITHUB_SHA" auth_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-license:$GITHUB_SHA" license_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-condition:$GITHUB_SHA" vehicle_condition_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-support:$GITHUB_SHA" support_service
          docker build -t "$DOCKERHUB_USERNAME/carsharing-minio:$GITHUB_SHA" deploy/minio
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_TOKEN" || { echo 'Add DOCKERHUB_TOKEN in repository Actions secrets'; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish versioned images
        run: |
          docker push "$DOCKERHUB_USERNAME/carsharing-rental:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-booking:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-payment:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-telemetry:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-auth:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-license:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-condition:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-support:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/carsharing-minio:$GITHUB_SHA"
      - name: Publish latest tags for the home server
        run: |
          docker tag "$DOCKERHUB_USERNAME/carsharing-rental:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-rental:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-booking:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-booking:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-payment:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-payment:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-telemetry:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-telemetry:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-auth:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-auth:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-license:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-license:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-condition:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-condition:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-support:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-support:latest"
          docker tag "$DOCKERHUB_USERNAME/carsharing-minio:$GITHUB_SHA" "$DOCKERHUB_USERNAME/carsharing-minio:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-rental:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-booking:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-payment:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-telemetry:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-auth:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-license:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-condition:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-support:latest"
          docker push "$DOCKERHUB_USERNAME/carsharing-minio:latest"
      - name: Log out
        if: always()
        run: docker logout
